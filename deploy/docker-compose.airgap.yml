services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${BONGSU_DB_USER:-bongsu}
      POSTGRES_PASSWORD: ${BONGSU_DB_PASSWORD:?Set BONGSU_DB_PASSWORD in .env}
      POSTGRES_DB: ${BONGSU_DB_NAME:-bongsu}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - bongsu-net

  server:
    image: bongsu-server:${BONGSU_VERSION:-0.1.0}
    ports:
      - "${BONGSU_PORT:-8080}:8080"
    environment:
      BONGSU_DB_DSN: postgres://${BONGSU_DB_USER:-bongsu}:${BONGSU_DB_PASSWORD:?Set BONGSU_DB_PASSWORD in .env}@postgres:5432/${BONGSU_DB_NAME:-bongsu}?sslmode=disable
      BONGSU_DB_MAX_OPEN_CONNS: ${BONGSU_DB_MAX_OPEN_CONNS:-25}
      BONGSU_DB_MAX_IDLE_CONNS: ${BONGSU_DB_MAX_IDLE_CONNS:-5}
      BONGSU_DB_CONN_MAX_LIFETIME_MINUTES: ${BONGSU_DB_CONN_MAX_LIFETIME_MINUTES:-5}
      BONGSU_API_KEY: ${BONGSU_API_KEY:?Set BONGSU_API_KEY in .env}
      BONGSU_AGENT_API_KEY: ${BONGSU_AGENT_API_KEY:?Set BONGSU_AGENT_API_KEY in .env}
      BONGSU_INSTALL_TOKEN: ${BONGSU_INSTALL_TOKEN:?Set BONGSU_INSTALL_TOKEN in .env}
      BONGSU_ALLOW_WEAK_SECRETS: ${BONGSU_ALLOW_WEAK_SECRETS:-false}
      BONGSU_AGENT_HOST_BINDING: ${BONGSU_AGENT_HOST_BINDING:-true}
      BONGSU_ACCESS_LOG: ${BONGSU_ACCESS_LOG:-true}
      BONGSU_ACCESS_LOG_HEALTH: ${BONGSU_ACCESS_LOG_HEALTH:-false}
      BONGSU_HTTP_READ_HEADER_TIMEOUT_SECONDS: ${BONGSU_HTTP_READ_HEADER_TIMEOUT_SECONDS:-10}
      BONGSU_HTTP_READ_TIMEOUT_SECONDS: ${BONGSU_HTTP_READ_TIMEOUT_SECONDS:-30}
      BONGSU_HTTP_WRITE_TIMEOUT_SECONDS: ${BONGSU_HTTP_WRITE_TIMEOUT_SECONDS:-120}
      BONGSU_HTTP_IDLE_TIMEOUT_SECONDS: ${BONGSU_HTTP_IDLE_TIMEOUT_SECONDS:-120}
      BONGSU_HTTP_MAX_HEADER_BYTES: ${BONGSU_HTTP_MAX_HEADER_BYTES:-1048576}
      BONGSU_VIEWER_API_KEYS: ${BONGSU_VIEWER_API_KEYS:-}
      BONGSU_CORS_ALLOWED_ORIGINS: ${BONGSU_CORS_ALLOWED_ORIGINS:-}
      BONGSU_AUTO_MIGRATE: "true"
      BONGSU_TRIVY_PATH: /usr/local/bin/trivy
      BONGSU_TRIVY_CACHE_DIR: /app/trivy-cache
      BONGSU_TRIVY_DB_INTERVAL_HOURS: "0"
      BONGSU_SECURITY_DB_SYNC_CMD: ""
      BONGSU_SECURITY_DB_SYNC_OUTPUT_MAX_BYTES: ${BONGSU_SECURITY_DB_SYNC_OUTPUT_MAX_BYTES:-8192}
      BONGSU_AUTO_RESCAN_ON_DB_UPDATE: ${BONGSU_AUTO_RESCAN_ON_DB_UPDATE:-true}
      BONGSU_AUTO_RESCAN_LAST_SEEN_HOURS: ${BONGSU_AUTO_RESCAN_LAST_SEEN_HOURS:-720}
      BONGSU_AGENT_REPORT_MAX_BYTES: ${BONGSU_AGENT_REPORT_MAX_BYTES:-536870912}
      BONGSU_TRIVY_DB_UPLOAD_MAX_BYTES: ${BONGSU_TRIVY_DB_UPLOAD_MAX_BYTES:-2147483648}
      BONGSU_CVE_DB_IMPORT_MAX_BYTES: ${BONGSU_CVE_DB_IMPORT_MAX_BYTES:-2147483648}
      BONGSU_SECURITY_DB_BUNDLE_MAX_BYTES: ${BONGSU_SECURITY_DB_BUNDLE_MAX_BYTES:-4294967296}
      BONGSU_MULTIPART_MEMORY_MAX_BYTES: ${BONGSU_MULTIPART_MEMORY_MAX_BYTES:-33554432}
      BONGSU_VULN_EXPORT_MAX_ROWS: ${BONGSU_VULN_EXPORT_MAX_ROWS:-100000}
      BONGSU_WEBHOOK_URL: ${BONGSU_WEBHOOK_URL:-}
      BONGSU_WEBHOOK_SECRET: ${BONGSU_WEBHOOK_SECRET:-}
      BONGSU_WEBHOOK_MIN_SEVERITY: ${BONGSU_WEBHOOK_MIN_SEVERITY:-HIGH}
      BONGSU_WEBHOOK_INVENTORY_STATUSES: ${BONGSU_WEBHOOK_INVENTORY_STATUSES:-empty}
      BONGSU_WEBHOOK_RETRY_ATTEMPTS: ${BONGSU_WEBHOOK_RETRY_ATTEMPTS:-3}
      BONGSU_WEBHOOK_RETRY_DELAY_MS: ${BONGSU_WEBHOOK_RETRY_DELAY_MS:-1000}
      BONGSU_SLA_CRITICAL_DAYS: ${BONGSU_SLA_CRITICAL_DAYS:-7}
      BONGSU_SLA_HIGH_DAYS: ${BONGSU_SLA_HIGH_DAYS:-30}
      BONGSU_SLA_MEDIUM_DAYS: ${BONGSU_SLA_MEDIUM_DAYS:-90}
      BONGSU_SLA_LOW_DAYS: ${BONGSU_SLA_LOW_DAYS:-180}
      BONGSU_WEB_AUTH: ${BONGSU_WEB_AUTH:-true}
    volumes:
      - trivy-cache:/app/trivy-cache
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bongsu-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  bongsu-net:
    driver: bridge

volumes:
  pgdata:
  trivy-cache:
