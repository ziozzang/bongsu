services:
  postgres:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - max_wal_size=${BONGSU_POSTGRES_MAX_WAL_SIZE:-4GB}
      - -c
      - checkpoint_timeout=${BONGSU_POSTGRES_CHECKPOINT_TIMEOUT:-15min}
      - -c
      - checkpoint_completion_target=${BONGSU_POSTGRES_CHECKPOINT_COMPLETION_TARGET:-0.9}
    environment:
      POSTGRES_USER: ${BONGSU_DB_USER:-bongsu}
      POSTGRES_PASSWORD: ${BONGSU_DB_PASSWORD:?Set BONGSU_DB_PASSWORD in .env}
      POSTGRES_DB: ${BONGSU_DB_NAME:-bongsu}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - bongsu-net

  server:
    image: bongsu-server:${BONGSU_VERSION:-0.1.0}
    ports:
      - "${BONGSU_API_PORT:-5677}:5677"
    environment:
      BONGSU_PORT: "5677"
      BONGSU_DB_DSN: postgres://${BONGSU_DB_USER:-bongsu}:${BONGSU_DB_PASSWORD:?Set BONGSU_DB_PASSWORD in .env}@postgres:5432/${BONGSU_DB_NAME:-bongsu}?sslmode=disable
      BONGSU_DB_MAX_OPEN_CONNS: ${BONGSU_DB_MAX_OPEN_CONNS:-25}
      BONGSU_DB_MAX_IDLE_CONNS: ${BONGSU_DB_MAX_IDLE_CONNS:-5}
      BONGSU_DB_CONN_MAX_LIFETIME_MINUTES: ${BONGSU_DB_CONN_MAX_LIFETIME_MINUTES:-5}
      BONGSU_API_KEY: ${BONGSU_API_KEY:?Set BONGSU_API_KEY in .env}
      BONGSU_AGENT_API_KEY: ${BONGSU_AGENT_API_KEY:?Set BONGSU_AGENT_API_KEY in .env}
      BONGSU_INSTALL_TOKEN: ${BONGSU_INSTALL_TOKEN:?Set BONGSU_INSTALL_TOKEN in .env}
      BONGSU_ALLOW_WEAK_SECRETS: ${BONGSU_ALLOW_WEAK_SECRETS:-false}
      BONGSU_AGENT_HOST_BINDING: ${BONGSU_AGENT_HOST_BINDING:-true}
      BONGSU_ACCESS_LOG: ${BONGSU_ACCESS_LOG:-true}
      BONGSU_ACCESS_LOG_HEALTH: ${BONGSU_ACCESS_LOG_HEALTH:-false}
      BONGSU_HTTP_READ_HEADER_TIMEOUT_SECONDS: ${BONGSU_HTTP_READ_HEADER_TIMEOUT_SECONDS:-10}
      BONGSU_HTTP_READ_TIMEOUT_SECONDS: ${BONGSU_HTTP_READ_TIMEOUT_SECONDS:-30}
      BONGSU_HTTP_WRITE_TIMEOUT_SECONDS: ${BONGSU_HTTP_WRITE_TIMEOUT_SECONDS:-900}
      BONGSU_HTTP_IDLE_TIMEOUT_SECONDS: ${BONGSU_HTTP_IDLE_TIMEOUT_SECONDS:-120}
      BONGSU_HTTP_MAX_HEADER_BYTES: ${BONGSU_HTTP_MAX_HEADER_BYTES:-1048576}
      BONGSU_VIEWER_API_KEYS: ${BONGSU_VIEWER_API_KEYS:-}
      BONGSU_TRUSTED_IDENTITY_HEADER: ${BONGSU_TRUSTED_IDENTITY_HEADER:-}
      BONGSU_TRUSTED_GROUPS_HEADER: ${BONGSU_TRUSTED_GROUPS_HEADER:-}
      BONGSU_TRUSTED_IDENTITY_PROXY_CIDRS: ${BONGSU_TRUSTED_IDENTITY_PROXY_CIDRS:-}
      BONGSU_TRUSTED_ADMIN_USERS: ${BONGSU_TRUSTED_ADMIN_USERS:-}
      BONGSU_TRUSTED_ADMIN_GROUPS: ${BONGSU_TRUSTED_ADMIN_GROUPS:-}
      BONGSU_CORS_ALLOWED_ORIGINS: ${BONGSU_CORS_ALLOWED_ORIGINS:-}
      BONGSU_HSTS_ENABLED: ${BONGSU_HSTS_ENABLED:-true}
      BONGSU_AUTO_MIGRATE: "true"
      BONGSU_TRIVY_PATH: /usr/local/bin/trivy
      BONGSU_TRIVY_CACHE_DIR: /app/trivy-cache
      BONGSU_TRIVY_DB_INTERVAL_HOURS: "0"
      BONGSU_SECURITY_DB_SYNC_CMD: ""
      BONGSU_SECURITY_DB_SYNC_ON_START: "false"
      BONGSU_SECURITY_DB_SYNC_OUTPUT_MAX_BYTES: ${BONGSU_SECURITY_DB_SYNC_OUTPUT_MAX_BYTES:-8192}
      BONGSU_SECURITY_DB_REQUIRED_SOURCES: ${BONGSU_SECURITY_DB_REQUIRED_SOURCES:-cisa-kev,epss,osv,nvd,trivy}
      BONGSU_SECURITY_DB_MAX_SOURCE_AGE_HOURS: ${BONGSU_SECURITY_DB_MAX_SOURCE_AGE_HOURS:-30}
      BONGSU_SYNC_REQUIRE_TRIVY_SOURCE: ${BONGSU_SYNC_REQUIRE_TRIVY_SOURCE:-false}
      BONGSU_AUTO_RESCAN_ON_DB_UPDATE: ${BONGSU_AUTO_RESCAN_ON_DB_UPDATE:-true}
      BONGSU_AUTO_RESCAN_LAST_SEEN_HOURS: ${BONGSU_AUTO_RESCAN_LAST_SEEN_HOURS:-720}
      BONGSU_CVE_MATCH_SOURCES: ${BONGSU_CVE_MATCH_SOURCES:-}
      BONGSU_CVE_MATCH_MIN_SOURCE_MATCHABLE_PERCENT: ${BONGSU_CVE_MATCH_MIN_SOURCE_MATCHABLE_PERCENT:-0}
      BONGSU_CVE_MATCH_CANDIDATE_LIMIT: ${BONGSU_CVE_MATCH_CANDIDATE_LIMIT:-50000}
      BONGSU_CVE_STATS_CACHE_SECONDS: ${BONGSU_CVE_STATS_CACHE_SECONDS:-15}
      BONGSU_CVE_STATS_STALE_SECONDS: ${BONGSU_CVE_STATS_STALE_SECONDS:-300}
      BONGSU_CVE_STATS_BACKGROUND_TIMEOUT_SECONDS: ${BONGSU_CVE_STATS_BACKGROUND_TIMEOUT_SECONDS:-30}
      BONGSU_CVE_SEARCH_TIMEOUT_SECONDS: ${BONGSU_CVE_SEARCH_TIMEOUT_SECONDS:-15}
      BONGSU_CVE_REFERENCE_GROUP_TIMEOUT_SECONDS: ${BONGSU_CVE_REFERENCE_GROUP_TIMEOUT_SECONDS:-10}
      BONGSU_CVE_AFFECTED_PACKAGES_TIMEOUT_SECONDS: ${BONGSU_CVE_AFFECTED_PACKAGES_TIMEOUT_SECONDS:-10}
      BONGSU_CVE_GROUP_SUMMARY_TIMEOUT_MS: ${BONGSU_CVE_GROUP_SUMMARY_TIMEOUT_MS:-1500}
      BONGSU_CVE_AFFECTED_INDEX_TIMEOUT_SECONDS: ${BONGSU_CVE_AFFECTED_INDEX_TIMEOUT_SECONDS:-5}
      BONGSU_CVE_AFFECTED_INDEX_REBUILD_TIMEOUT_SECONDS: ${BONGSU_CVE_AFFECTED_INDEX_REBUILD_TIMEOUT_SECONDS:-900}
      BONGSU_CVE_REFERENCE_INDEX_TIMEOUT_SECONDS: ${BONGSU_CVE_REFERENCE_INDEX_TIMEOUT_SECONDS:-5}
      BONGSU_CVE_REFERENCE_INDEX_REBUILD_TIMEOUT_SECONDS: ${BONGSU_CVE_REFERENCE_INDEX_REBUILD_TIMEOUT_SECONDS:-900}
      BONGSU_HEALTH_DB_TIMEOUT_SECONDS: ${BONGSU_HEALTH_DB_TIMEOUT_SECONDS:-2}
      BONGSU_SECURITY_DB_STATUS_TIMEOUT_SECONDS: ${BONGSU_SECURITY_DB_STATUS_TIMEOUT_SECONDS:-15}
      BONGSU_SECURITY_DB_REVISION_TIMEOUT_SECONDS: ${BONGSU_SECURITY_DB_REVISION_TIMEOUT_SECONDS:-30}
      BONGSU_DB_CONNECT_TIMEOUT_SECONDS: ${BONGSU_DB_CONNECT_TIMEOUT_SECONDS:-30}
      BONGSU_DB_MIGRATION_TIMEOUT_SECONDS: ${BONGSU_DB_MIGRATION_TIMEOUT_SECONDS:-600}
      BONGSU_STARTUP_RECALC_TIMEOUT_SECONDS: ${BONGSU_STARTUP_RECALC_TIMEOUT_SECONDS:-120}
      BONGSU_STALE_REMATCH_CLEANUP_BATCH_SIZE: ${BONGSU_STALE_REMATCH_CLEANUP_BATCH_SIZE:-10000}
      BONGSU_AGENT_REPORT_MAX_BYTES: ${BONGSU_AGENT_REPORT_MAX_BYTES:-536870912}
      BONGSU_TRIVY_DB_UPLOAD_MAX_BYTES: ${BONGSU_TRIVY_DB_UPLOAD_MAX_BYTES:-2147483648}
      BONGSU_CVE_DB_IMPORT_MAX_BYTES: ${BONGSU_CVE_DB_IMPORT_MAX_BYTES:-2147483648}
      BONGSU_SECURITY_DB_BUNDLE_MAX_BYTES: ${BONGSU_SECURITY_DB_BUNDLE_MAX_BYTES:-4294967296}
      BONGSU_MULTIPART_MEMORY_MAX_BYTES: ${BONGSU_MULTIPART_MEMORY_MAX_BYTES:-33554432}
      BONGSU_JSON_BODY_MAX_BYTES: ${BONGSU_JSON_BODY_MAX_BYTES:-1048576}
      BONGSU_API_MAX_PAGE_LIMIT: ${BONGSU_API_MAX_PAGE_LIMIT:-1000}
      BONGSU_API_MAX_PAGE_OFFSET: ${BONGSU_API_MAX_PAGE_OFFSET:-1000000}
      BONGSU_VULNERABILITY_LIST_TIMEOUT_SECONDS: ${BONGSU_VULNERABILITY_LIST_TIMEOUT_SECONDS:-15}
      BONGSU_VULNERABILITY_EXPORT_TIMEOUT_SECONDS: ${BONGSU_VULNERABILITY_EXPORT_TIMEOUT_SECONDS:-60}
      BONGSU_VULN_EXPORT_MAX_ROWS: ${BONGSU_VULN_EXPORT_MAX_ROWS:-100000}
      BONGSU_WEBHOOK_URL: ${BONGSU_WEBHOOK_URL:-}
      BONGSU_WEBHOOK_SECRET: ${BONGSU_WEBHOOK_SECRET:-}
      BONGSU_WEBHOOK_MIN_SEVERITY: ${BONGSU_WEBHOOK_MIN_SEVERITY:-HIGH}
      BONGSU_WEBHOOK_MIN_RISK_LEVEL: ${BONGSU_WEBHOOK_MIN_RISK_LEVEL:-high}
      BONGSU_WEBHOOK_INVENTORY_STATUSES: ${BONGSU_WEBHOOK_INVENTORY_STATUSES:-empty}
      BONGSU_WEBHOOK_RETRY_ATTEMPTS: ${BONGSU_WEBHOOK_RETRY_ATTEMPTS:-3}
      BONGSU_WEBHOOK_RETRY_DELAY_MS: ${BONGSU_WEBHOOK_RETRY_DELAY_MS:-1000}
      BONGSU_WEBHOOK_TIMEOUT_SECONDS: ${BONGSU_WEBHOOK_TIMEOUT_SECONDS:-15}
      BONGSU_SLA_CRITICAL_DAYS: ${BONGSU_SLA_CRITICAL_DAYS:-7}
      BONGSU_SLA_HIGH_DAYS: ${BONGSU_SLA_HIGH_DAYS:-30}
      BONGSU_SLA_MEDIUM_DAYS: ${BONGSU_SLA_MEDIUM_DAYS:-90}
      BONGSU_SLA_LOW_DAYS: ${BONGSU_SLA_LOW_DAYS:-180}
      BONGSU_TRIAGE_EXPIRING_SOON_DAYS: ${BONGSU_TRIAGE_EXPIRING_SOON_DAYS:-14}
      BONGSU_AGENT_ONLINE_MINUTES: ${BONGSU_AGENT_ONLINE_MINUTES:-1560}
      BONGSU_AGENT_OFFLINE_MINUTES: ${BONGSU_AGENT_OFFLINE_MINUTES:-4320}
      BONGSU_INVENTORY_STALE_HOURS: ${BONGSU_INVENTORY_STALE_HOURS:-48}
      BONGSU_RETENTION_SCAN_DAYS: ${BONGSU_RETENTION_SCAN_DAYS:-180}
      BONGSU_RETENTION_SCAN_REQUEST_DAYS: ${BONGSU_RETENTION_SCAN_REQUEST_DAYS:-90}
      BONGSU_RETENTION_AUDIT_DAYS: ${BONGSU_RETENTION_AUDIT_DAYS:-365}
      BONGSU_SCAN_REQUEST_CLAIM_TIMEOUT_MINUTES: ${BONGSU_SCAN_REQUEST_CLAIM_TIMEOUT_MINUTES:-60}
      BONGSU_WEB_AUTH: ${BONGSU_WEB_AUTH:-true}
    volumes:
      - trivy-cache:/app/trivy-cache
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bongsu-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5677/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    image: bongsu-web:${BONGSU_VERSION:-0.1.0}
    ports:
      - "${BONGSU_WEB_PORT:-5678}:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bongsu-net

networks:
  bongsu-net:
    driver: bridge

volumes:
  pgdata:
  trivy-cache:
