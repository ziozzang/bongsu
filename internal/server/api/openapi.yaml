                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  requeued:
                    type: integer
                  cancelled_duplicates:
                    type: integer
                  timeout_minutes:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/scan-requests/requeue-filtered:
    post:
