      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sources:
                  type: array
                  items:
                    type: string
                min_source_matchable_percent:
                  type: number
                  format: double
                scan_id:
                  type: string
                candidate_limit:
                  type: integer
      responses:
        "200":
          description: Rematch result
