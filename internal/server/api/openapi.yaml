      tags: [admin]
      summary: Import CVE JSONL
      description: Upload a JSONL file of CVE entries.
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                source:
                  type: string
                  default: custom
                replace:
                  type: boolean
                  default: true
                  description: Replace existing rows for the source before importing.
                finalize:
                  type: boolean
                  default: true
                  description: Refresh derived CVE indexes and queue security recalculation after import. Set false for deferred bulk chunks and finalize once after all chunks.
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  imported:
                    type: integer
                  total:
                    type: integer
                  security_db_revision:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

