      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: []
              properties:
                host_id:
                  type: string
                status:
                  type: string
                  enum: [failed, degraded, cancelled]
                scan_type:
                  type: string
                  enum: [manual, daily, security-db-update]
