      responses:
        "200":
          description: Notification rule details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateNotificationRule
      tags: [notifications]
      summary: Update a notification rule
      security:
        - AdminKey: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationRuleUpdate"
      responses:
        "200":
          description: Notification rule updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationRule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteNotificationRule
      tags: [notifications]
      summary: Delete a notification rule
      security:
        - AdminKey: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Notification rule deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/admin/notification-rules/{id}/test:
    post:
      operationId: testNotificationRule
      tags: [notifications]
      summary: Send a test notification for a rule
      security:
        - AdminKey: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Test notification sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: sent
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/admin/notification-log:
    get:
      operationId: listNotificationLog
      tags: [notifications]
      summary: List notification delivery log
      security:
        - AdminKey: []
        - bearerAuth: []
      parameters:
        - name: rule_id
          in: query
          schema:
            type: string
          description: Filter by notification rule ID
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated notification log entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/NotificationLog"
                  total:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Phase 4d: Reports ──────────────────────────────────────────────────

  /api/reports/executive-summary:
    get:
      operationId: getExecutiveSummary
      tags: [reports]
      summary: Generate executive summary report
      security:
        - AdminKey: []
        - ViewerKey: []
        - bearerAuth: []
      responses:
        "200":
          description: Executive summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutiveSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/reports/risk-breakdown:
    get:
      operationId: getRiskBreakdown
      tags: [reports]
      summary: Get risk breakdown by group
      security:
        - AdminKey: []
        - ViewerKey: []
        - bearerAuth: []
      parameters:
        - name: group_by
          in: query
          schema:
            type: string
          description: "Metadata field to group by (owner, team, environment, criticality)"
      responses:
        "200":
          description: Risk breakdown rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/RiskBreakdownRow"
                  group_by:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/reports/sla-compliance:
    get:
      operationId: getSlaCompliance
      tags: [reports]
      summary: Get SLA compliance report
      security:
        - AdminKey: []
        - ViewerKey: []
        - bearerAuth: []
      responses:
        "200":
          description: SLA compliance report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SLAComplianceReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/reports/export:
    get:
      operationId: exportReport
      tags: [reports]
      summary: Export a report
      description: Export executive summary, SLA compliance, or full report as JSON or CSV.
      security:
        - AdminKey: []
        - ViewerKey: []
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [executive, sla, full]
          description: Report type to export
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv]
            default: json
          description: Export format
        - name: group_by
          in: query
          schema:
            type: string
          description: "Metadata field to group by (owner, team, environment, criticality)"
      responses:
        "200":
          description: Exported report
          content:
            application/json:
              schema:
                type: object
            text/csv:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  # ── Security Schemes ──────────────────────────────────────────────────

  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key

    bearerAuth:
      type: http
      scheme: bearer
      description: Session token

    AdminKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Admin API key

    AgentKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Agent API key (or admin key)

    ViewerKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Viewer API key (subject:key format)

    InstallToken:
      type: apiKey
      in: header
      name: X-Install-Token
      description: Install token

  # ── Reusable Parameters ──────────────────────────────────────────────

  parameters:
    HostID:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Host ID

    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 50
      description: Maximum items to return

    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        maximum: 1000000
        default: 0
      description: Number of items to skip

  # ── Reusable Responses ───────────────────────────────────────────────

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthorized:
      description: Unauthorized
      content:
        text/plain:
          schema:
            type: string
            example: unauthorized

    Forbidden:
      description: Forbidden
      content:
        text/plain:
          schema:
            type: string
            example: forbidden

    NotFound:
      description: Not found
      content:
        text/plain:
          schema:
            type: string
            example: not found

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  # ── Schemas ──────────────────────────────────────────────────────────

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string

    StatusOK:
      type: object
      properties:
        status:
          type: string
          example: ok

    # ── Health ────────────────────────────────────────────────────────

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        trivy_db_ready:
          type: boolean
        web_auth:
          type: boolean
        version:
          type: string
        commit:
          type: string
        build_date:
          type: string
        uptime_seconds:
          type: integer
        security_db_revision:
          type: string
        security_recalculation:
          type: object
        security_db_freshness:
          type: object
        trivy_db:
          type: object
        security_db:
          type: object

    # ── Host ──────────────────────────────────────────────────────────

    Host:
      type: object
      properties:
        id:
          type: string
        hostname:
          type: string
        ip_address:
          type: string
        os_name:
          type: string
        os_version:
          type: string
        kernel:
          type: string
        arch:
          type: string
        cpu_model:
          type: string
        cpu_cores:
          type: integer
        memory_mb:
          type: integer
          format: int64
        agent_version:
          type: string
        agent_token_set:
          type: boolean
        owner:
          type: string
        team:
          type: string
        environment:
          type: string
        criticality:
          type: string
        tags:
          type: string
        last_seen:
          type: string
          format: date-time
        agent_status:
          type: string
          enum: [online, stale, offline, unknown]
        last_seen_age_seconds:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time

    HostWithVulns:
      allOf:
        - $ref: "#/components/schemas/Host"
        - type: object
          properties:
            vuln_counts:
              type: object
              additionalProperties:
                type: integer
            active_vuln_counts:
              type: object
              additionalProperties:
                type: integer
            latest_inventory:
              $ref: "#/components/schemas/HostInventorySummary"

    HostInventorySummary:
      type: object
      properties:
        scan_id:
          type: string
        package_count:
          type: integer
        vuln_count:
          type: integer
        container_count:
          type: integer
        scan_status:
          type: string
        scanned_at:
          type: string
          format: date-time

    HostMetadataUpdate:
      type: object
      properties:
        owner:
          type: string
        team:
          type: string
        environment:
          type: string
        criticality:
          type: string
        tags:
          type: string
          description: Valid JSON string

    # ── Vulnerability ─────────────────────────────────────────────────

    Vulnerability:
      type: object
      properties:
        id:
          type: string
        package_id:
          type: string
        scan_id:
          type: string
        host_id:
          type: string
        vulnerability_id:
          type: string
        severity:
          type: string
        title:
          type: string
        description:
          type: string
        pkg_name:
          type: string
        asset_type:
          type: string
        pkg_type:
          type: string
        ecosystem:
          type: string
        container_id:
          type: string
        image_name:
          type: string
        image_id:
          type: string
        target:
          type: string
        pkg_path:
          type: string
        installed_version:
          type: string
        fixed_version:
          type: string
        cvss_score:
          type: number
          format: double
        cvss_vector:
          type: string
        primary_url:
          type: string
        container:
          type: string
        layer_id:
          type: string
        finding_source:
          type: string
        advisory_sources:
          type: array
          items:
            type: string
        advisory_evidence:
          type: array
          items:
            $ref: "#/components/schemas/AdvisoryEvidence"
        host_owner:
          type: string
        host_team:
          type: string
        host_environment:
          type: string
        host_criticality:
          type: string
        exploited:
          type: boolean
        epss_score:
          type: number
          format: double
        epss_percentile:
          type: number
          format: double
        risk_score:
          type: number
          format: double
        risk_level:
          type: string
        triage_status:
          type: string
        triage_reason:
          type: string
        triage_comment:
          type: string
        triage_expires_at:
          type: string
          format: date-time
        triage_updated_by:
          type: string
        triage_updated_at:
          type: string
          format: date-time
        sla_days:
          type: integer
        due_at:
          type: string
          format: date-time
        overdue:
          type: boolean
        created_at:
          type: string
          format: date-time

    AdvisoryEvidence:
      type: object
      properties:
        source:
          type: string
        category:
          type: string
        ecosystem:
          type: string
        severity:
          type: string
        cvss_score:
          type: number
          format: double
        epss_score:
          type: number
          format: double
        fixed_version:
          type: string
        title:
          type: string

    VulnerabilityTriage:
      type: object
      required: [vulnerability_id, status]
      properties:
        id:
          type: string
        vulnerability_id:
          type: string
        host_id:
          type: string
        pkg_name:
          type: string
        status:
          type: string
          enum: [open, in_progress, accepted_risk, false_positive, fixed, ignored]
        reason:
          type: string
        comment:
          type: string
        expires_at:
          type: string
          format: date-time
        updated_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ── Package ───────────────────────────────────────────────────────

    Package:
      type: object
      properties:
        id:
          type: string
        scan_id:
          type: string
        host_id:
          type: string
        asset_type:
          type: string
        asset_id:
          type: string
        source:
          type: string
        container:
          type: string
        container_id:
          type: string
        image_name:
          type: string
        image_id:
          type: string
        name:
          type: string
        version:
          type: string
        arch:
          type: string
        pkg_type:
          type: string
        ecosystem:
          type: string
        purl:
          type: string
        src_name:
          type: string
        file_path:
          type: string
        layer_id:
          type: string
        target:
          type: string
        max_cvss:
          type: number
          format: double
        vuln_count:
          type: integer
        created_at:
          type: string
          format: date-time

    # ── Container ─────────────────────────────────────────────────────

    ContainerAsset:
      type: object
      properties:
        id:
          type: string
        scan_id:
          type: string
        host_id:
          type: string
        runtime:
          type: string
        container_id:
          type: string
        name:
          type: string
        image_name:
          type: string
        image_id:
          type: string
        image_digest:
          type: string
        state:
          type: string
        labels:
          type: string
        started_at:
          type: string
          format: date-time
        package_count:
          type: integer
        vulnerability_count:
          type: integer
        critical_count:
          type: integer
        high_count:
          type: integer
        max_cvss:
          type: number
          format: double
        created_at:
          type: string
          format: date-time

    # ── Scan ──────────────────────────────────────────────────────────

    Scan:
      type: object
      properties:
        id:
          type: string
        host_id:
          type: string
        scan_type:
          type: string
        status:
          type: string
          enum: [running, completed, degraded, failed]
        error_summary:
          type: string
        security_db_revision:
          type: string
        scan_request_id:
          type: string
        package_count:
          type: integer
        vulnerability_count:
          type: integer
        container_count:
          type: integer
        packages_added:
          type: integer
        packages_removed:
          type: integer
        packages_changed:
          type: integer
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    ScanRequest:
      type: object
      properties:
        id:
          type: string
        host_id:
          type: string
        requested_by:
          type: string
        scan_type:
          type: string
          enum: [manual, daily, security-db-update]
        packages_only:
          type: boolean
        reason:
          type: string
        security_db_revision:
          type: string
        status:
          type: string
          enum: [pending, claimed, completed, degraded, failed, cancelled]
        error_message:
          type: string
        claimed_by_host_id:
          type: string
        claimed_at:
          type: string
          format: date-time
        request_age_seconds:
          type: integer
          format: int64
        claim_age_seconds:
          type: integer
          format: int64
        request_stale:
          type: boolean
        claim_stale:
          type: boolean
        completed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    ScanRequestCreate:
      type: object
      properties:
        host_id:
          type: string
        scan_type:
          type: string
          enum: [manual, daily, security-db-update]
          default: manual
        packages_only:
          type: boolean
        reason:
          type: string
        requested_by:
          type: string
        security_db_revision:
          type: string

    # ── Scan Report ───────────────────────────────────────────────────

    ScanReport:
      type: object
      required: [host]
      properties:
        host:
          $ref: "#/components/schemas/Host"
        scan_type:
          type: string
          enum: [inventory, daily, manual, security-db-update]
          default: inventory
        scan_id:
          type: string
          description: UUID, auto-generated if empty
        scan_request_id:
          type: string
        security_db_revision:
          type: string
        errors:
          type: array
          items:
            type: string
        containers:
          type: array
          items:
            $ref: "#/components/schemas/ContainerAsset"
        packages:
          type: array
          items:
            $ref: "#/components/schemas/Package"
        vulnerabilities:
          type: array
          items:
            $ref: "#/components/schemas/Vulnerability"
        users:
          type: array
          items:
            $ref: "#/components/schemas/UserAccount"
        processes:
          type: array
          items:
            $ref: "#/components/schemas/ProcessSnapshot"
        ports:
          type: array
          items:
            $ref: "#/components/schemas/PortInfo"
        timestamp:
          type: string
          format: date-time

    UserAccount:
      type: object
      properties:
        id:
          type: string
        scan_id:
          type: string
        host_id:
          type: string
        username:
          type: string
        uid:
          type: integer
        gid:
          type: integer
        home_dir:
          type: string
        shell:
          type: string

    ProcessSnapshot:
      type: object
      properties:
        id:
          type: string
        scan_id:
          type: string
        host_id:
          type: string
        pid:
          type: integer
        name:
          type: string
        cmdline:
          type: string
        user:
          type: string
        cpu_usage:
          type: number
          format: double
        mem_usage:
          type: number
          format: double

    PortInfo:
      type: object
      properties:
        id:
          type: string
        scan_id:
          type: string
        host_id:
          type: string
        name:
          type: string
        port:
          type: integer
        protocol:
          type: string
        address:
          type: string
        pid:
          type: integer

    ReportResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        scan_id:
          type: string
        scan_status:
          type: string
          enum: [completed, degraded]
        inventory_status:
          type: string
          enum: [healthy, degraded, empty]
        error_summary:
          type: string
        security_db_revision:
          type: string
        ingest_error_count:
          type: integer
        skipped_vuln_count:
          type: integer

    # ── CVE Entry ─────────────────────────────────────────────────────

    CveEntry:
      type: object
      properties:
        id:
          type: string
        vulnerability_id:
          type: string
        source:
          type: string
        category:
          type: string
        ecosystem:
          type: string
        severity:
          type: string
        cvss_score:
          type: number
          format: double
        cvss_vector:
          type: string
        epss_score:
          type: number
          format: double
        epss_percentile:
          type: number
          format: double
        matchable:
          type: boolean
        matchable_affected_count:
          type: integer
        matchability_reason:
          type: string
        reference_group_total:
          type: integer
        reference_group_matchable:
          type: integer
        reference_group_sources:
          type: integer
        reference_group_status:
          type: string
        reference_group_key:
          type: string
        title:
          type: string
        description:
          type: string
        published_date:
          type: string
          format: date-time
        modified_date:
          type: string
          format: date-time
        affected_products:
          type: string
        references:
          type: string
        reference_keys:
          type: array
          items:
            type: string
        raw_data:
          type: string
        updated_at:
          type: string
          format: date-time

    # ── RBAC ──────────────────────────────────────────────────────────

    AccessSubject:
      type: object
      properties:
        id:
          type: string
        subject_type:
          type: string
          enum: [user, group]
        external_id:
          type: string
        display_name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AccessPolicy:
      type: object
      properties:
        id:
          type: string
        subject_id:
          type: string
        subject_type:
          type: string
        subject_external_id:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
        permission:
          type: string
        created_at:
          type: string
          format: date-time

    # ── Audit Log ─────────────────────────────────────────────────────

    AuditLog:
      type: object
      properties:
        id:
          type: string
        actor_type:
          type: string
        actor_id:
          type: string
        action:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
        status:
          type: string
        ip_address:
          type: string
        user_agent:
          type: string
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    # ── Installer ─────────────────────────────────────────────────────

    InstallerStatus:
      type: object
      properties:
        install_token_configured:
          type: boolean
        ready:
          type: boolean
        agent:
          $ref: "#/components/schemas/InstallerBinaryStatus"
        trivy:
          $ref: "#/components/schemas/InstallerBinaryStatus"

    InstallerBinaryStatus:
      type: object
      properties:
        name:
          type: string
        ready:
          type: boolean
        path:
          type: string
        version:
          type: string
        bytes:
          type: integer
          format: int64
        sha256:
          type: string
        error:
          type: string

    # ── Dashboard Stats ───────────────────────────────────────────────

    DashboardStats:
      type: object
      properties:
        total_hosts:
          type: integer
        total_vulnerabilities:
          type: integer
