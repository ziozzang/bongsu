      responses:
        "200":
          description: DB loaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Trivy DB manager not available

  /api/admin/trivy-db/update:
    post:
      operationId: updateTrivyDB
      tags: [admin]
      summary: Trigger Trivy DB update
      security:
        - AdminKey: []
      responses:
        "200":
          description: Update triggered
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  message:
                    type: string
                  trivy_db_ready:
                    type: boolean
                  last_update:
                    type: string
                    format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Download failed
        "503":
          description: Trivy DB manager not available

  # ── Admin Security DB ───────────────────────────────────────────────────

  /api/admin/security-db/export:
    get:
      operationId: exportSecurityDb
      tags: [admin]
      summary: Export security DB bundle
      security:
        - AdminKey: []
      parameters:
        - name: include_trivy
          in: query
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Security DB bundle tar.gz
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/admin/security-db/import:
    post:
      operationId: importSecurityDb
      tags: [admin]
      summary: Import security DB bundle
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [bundle]
              properties:
                bundle:
                  type: string
                  format: binary
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  imported:
                    type: integer
                  trivy_db_loaded:
                    type: boolean
                  security_db_revision:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Trivy DB manager required but unavailable

  /api/admin/security-db/update:
    post:
      operationId: updateSecurityDb
      tags: [admin]
      summary: Trigger security DB update
      security:
        - AdminKey: []
      responses:
        "200":
          description: Update result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  security_db:
                    type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Update failed
        "503":
          description: Security DB manager not available

  /api/admin/security-db/recalculate:
    post:
      operationId: recalculateSecurityDb
      tags: [admin]
      summary: Trigger security recalculation
      security:
        - AdminKey: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Recalculation queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: queued
                  reason:
                    type: string
                  security_recalculation:
                    type: object
                  security_db_revision:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  # ── Security Schemes ──────────────────────────────────────────────────

  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key

    bearerAuth:
      type: http
      scheme: bearer
      description: Session token

    AdminKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Admin API key

    AgentKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Agent API key (or admin key)

    ViewerKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Viewer API key (subject:key format)

    InstallToken:
      type: apiKey
      in: header
      name: X-Install-Token
      description: Install token

  # ── Reusable Parameters ──────────────────────────────────────────────

  parameters:
    HostID:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Host ID

    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 50
      description: Maximum items to return

    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        maximum: 1000000
        default: 0
      description: Number of items to skip

  # ── Reusable Responses ───────────────────────────────────────────────

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthorized:
      description: Unauthorized
      content:
        text/plain:
          schema:
            type: string
            example: unauthorized

    Forbidden:
      description: Forbidden
      content:
        text/plain:
          schema:
            type: string
            example: forbidden

    NotFound:
      description: Not found
      content:
        text/plain:
          schema:
            type: string
            example: not found

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  # ── Schemas ──────────────────────────────────────────────────────────

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string

    StatusOK:
      type: object
      properties:
        status:
          type: string
          example: ok

    # ── Health ────────────────────────────────────────────────────────

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        trivy_db_ready:
          type: boolean
        web_auth:
          type: boolean
        version:
          type: string
        commit:
          type: string
        build_date:
          type: string
        uptime_seconds:
          type: integer
        security_db_revision:
          type: string
        security_recalculation:
          type: object
        security_db_freshness:
          type: object
        trivy_db:
          type: object
        security_db:
          type: object

    # ── Host ──────────────────────────────────────────────────────────

    Host:
      type: object
      properties:
        id:
          type: string
        hostname:
          type: string
        ip_address:
          type: string
        os_name:
          type: string
        os_version:
          type: string
        kernel:
          type: string
        arch:
          type: string
        cpu_model:
          type: string
        cpu_cores:
          type: integer
        memory_mb:
          type: integer
          format: int64
        agent_version:
          type: string
        agent_token_set:
          type: boolean
        owner:
          type: string
        team:
          type: string
        environment:
          type: string
        criticality:
          type: string
        tags:
          type: string
        last_seen:
          type: string
          format: date-time
        agent_status:
          type: string
          enum: [online, stale, offline, unknown]
        last_seen_age_seconds:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time

    HostWithVulns:
      allOf:
