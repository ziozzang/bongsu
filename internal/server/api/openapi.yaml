  # ── Agent ───────────────────────────────────────────────────────────────

  /api/report:
    post:
      operationId: submitReport
      tags: [agent]
      summary: Submit scan report
      description: Agents submit scan results including host, packages, vulnerabilities, and containers.
      security:
        - AgentKey: []
      parameters:
        - name: X-Bongsu-Agent-Token
          in: header
          schema:
            type: string
          description: Agent host binding token
        - name: X-Bongsu-Host-ID
          in: header
          schema:
            type: string
          description: Host ID matching the report host
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanReport"
      responses:
        "200":
          description: Report accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Agent token mismatch or host binding error
        "413":
          description: Report too large

  /api/agent/scan-requests/claim:
    post:
      operationId: claimScanRequest
      tags: [agent]
      summary: Claim a scan request
      security:
        - AgentKey: []
      parameters:
        - name: host_id
          in: query
          required: true
          schema:
            type: string
        - name: X-Bongsu-Agent-Token
          in: header
          schema:
            type: string
        - name: X-Bongsu-Host-ID
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Scan request claimed (or no pending requests)
          content:
            application/json:
              schema:
                type: object
                properties:
                  request:
                    nullable: true
                    allOf:
                      - $ref: "#/components/schemas/ScanRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/agent/scan-requests/{id}/complete:
    post:
      operationId: completeScanRequest
      tags: [agent]
      summary: Complete a claimed scan request
      security:
        - AgentKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: X-Bongsu-Agent-Token
          in: header
          schema:
            type: string
        - name: X-Bongsu-Host-ID
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host_id]
              properties:
                status:
                  type: string
                  enum: [completed, degraded, failed]
                  default: completed
                message:
                  type: string
                host_id:
                  type: string
      responses:
        "200":
          description: Scan request completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: completed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Scan request is not active or claim mismatch

